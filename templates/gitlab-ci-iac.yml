# Unified CI/CD Security Shield (IaC + Secrets + Containers)
iac_security_scan:
  stage: test
  image: 
    name: ghcr.io/<YOUR-USERNAME>/iac-sanity-checker:latest
    entrypoint: [""]
  variables:
    OPENAI_API_KEY: $OPENAI_API_KEY # Ensure this variable is set in CI/CD settings
  script:
    - python /app/main.pyc . --generate-report --min-severity LOW
  artifacts:
    name: "security-shield-report-$CI_COMMIT_SHORT_SHA"
    paths:
      - security_audit_report.html
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_ID
