name: IaC Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # for uploading SARIF if we wanted to
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run IaC Sanity Check
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        # Run with report generation. 
        # Using --min-severity LOW to see everything, but you can adjust.
        # We don't fail the build here technically because main.py handles exit codes,
        # but if we wanted to enforce quality gates we could.
        python main.py . --generate-report --min-severity LOW

    - name: Upload Security Report
      uses: actions/upload-artifact@v3
      if: always() # Upload report even if scan fails
      with:
        name: security-audit-report
        path: security_audit_report.html
